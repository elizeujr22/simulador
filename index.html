<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Economia de Energia</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1ebd56; }
    .result { margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 6px; }
    .notice { margin-top: 10px; font-size: 13px; color: #555; text-align: center; font-style: italic; }
  </style>
</head>
<body>

  <h2>Simulador de Economia de Energia (18%)</h2>
  
  <div class="form-group">
    <label for="uf">Estado (UF):</label>
    <select id="uf" onchange="calcular()">
      <option value="PE">Pernambuco (PE) - R$ 1,04/kWh</option>
      <option value="BA">Bahia (BA) - R$ 1,14/kWh</option>
      <option value="MG">Minas Gerais (MG) - R$ 1,16/kWh</option>
      <option value="PA">Pará (PA) - R$ 1,25/kWh</option>
      <option value="TO">Tocantins (TO) - R$ 1,28/kWh</option>
      <option value="MS">Mato Grosso do Sul (MS) - R$ 1,25/kWh</option>
      <option value="MT">Mato Grosso (MT) - R$ 1,15/kWh</option>
      <option value="GO">Goiás (GO) - R$ 1,15/kWh</option>
      <option value="RN">Rio Grande do Norte (RN) - R$ 1,02/kWh</option>
    </select>
  </div>

  <div class="form-group">
    <label for="kwh">Consumo Mensal (kWh):</label>
    <input type="number" id="kwh" placeholder="Ex: 400" value="400" oninput="calcular()">
  </div>

  <div class="result" id="painelResultado">
    <p><strong>Valor Consumo (kWh x Tarifa):</strong> <span id="resBruto">R$ 0,00</span></p>
    <p><strong>Economia Mensal (18%):</strong> <span id="resEconomia" style="color: green;">R$ 0,00</span></p>
    <p><strong>Economia Anual Projetada:</strong> <span id="resAnual" style="color: green;">R$ 0,00</span></p>
  </div>

  <button onclick="enviarWhatsApp()">Enviar Proposta pelo WhatsApp</button>
  <p class="notice">📌 Após clicar no botão, anexe a foto ou PDF da sua última fatura de energia na conversa.</p>

  <script>
    // Tarifas atualizadas para o limite superior de referência com impostos
    const tarifas = {
      PA: 1.25, TO: 1.28, MS: 1.25, MT: 1.15, GO: 1.15,
      MG: 1.16, BA: 1.14, PE: 1.04, RN: 1.02
    };

    const numeroWhatsApp = "5581989882304"; 

    function calcular() {
      const uf = document.getElementById('uf').value;
      const kwh = parseFloat(document.getElementById('kwh').value) || 0;
      const tarifa = tarifas[uf];
      
      const valorConsumo = kwh * tarifa;
      const economiaMensal = valorConsumo * 0.18;
      const economiaAnual = economiaMensal * 12;

      document.getElementById('resBruto').innerText = `R$ ${valorConsumo.toFixed(2)}`;
      document.getElementById('resEconomia').innerText = `R$ ${economiaMensal.toFixed(2)}`;
      document.getElementById('resAnual').innerText = `R$ ${economiaAnual.toFixed(2)}`;
    }

    function enviarWhatsApp() {
      const uf = document.getElementById('uf').value;
      const kwh = document.getElementById('kwh').value;
      const tarifa = tarifas[uf];
      
      const valorConsumo = kwh * tarifa;
      const economiaMensal = valorConsumo * 0.18;
      const novaContaConsumo = valorConsumo - economiaMensal;
      const economiaAnual = economiaMensal * 12;

      const mensagem = `*SIMULAÇÃO DE ECONOMIA DE ENERGIA* %0A%0A` +
        `*Estado:* ${uf}%0A` +
        `*Consumo:* ${kwh} kWh/mês%0A` +
        `----------------------------------%0A` +
        `*Valor Base Consumo (kWh x Tarifa):* R$ ${valorConsumo.toFixed(2)}%0A` +
        `*Desconto Garantido:* 18%%0A` +
        `*Economia Mensal:* R$ ${economiaMensal.toFixed(2)}%0A` +
        `*Novo Valor de Consumo Estimado:* R$ ${novaContaConsumo.toFixed(2)}%0A` +
        `*Economia em 1 Ano:* R$ ${economiaAnual.toFixed(2)}%0A%0A` +
        `Gostaria de ativar meu desconto de 18%!%0A%0A` +
        `📄 *[IMPORTANTE]* Segue em anexo a foto/PDF da minha fatura de energia para validação dos dados:`;

      window.open(`https://wa.me/${numeroWhatsApp}?text=${mensagem}`, '_blank');
    }

    // Inicializa o cálculo ao carregar a página
    calcular();
  </script>
</body>
</html>
